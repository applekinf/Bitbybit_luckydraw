<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyến tàu xuyên Việt</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;background:#0f2238;color:#1d2a3a}
button{font-family:inherit;cursor:pointer;border:0}

/* ===== STAGE (camera chính) ===== */
#stage{position:fixed;inset:0;overflow:hidden;transform-origin:0 0;z-index:1;background:linear-gradient(#7cc6f2 0%,#cdeaf9 55%,#eef8ff 100%)}
#stage.mini{box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 10px rgba(255,255,255,.9);cursor:pointer}
.mtn{position:absolute;left:0;right:0;bottom:0;background-repeat:repeat-x}
#far{top:16%;opacity:.75}
#near{top:30%}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;filter:blur(1px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-70%}
.cloud::after{width:40%;height:130%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.ground{position:absolute;left:-4000px;top:-70px;height:4000px;background:linear-gradient(#86b862 0,#76a854 70px,#9a8a6a 70px,#8c7c5c 96px,#6f9d4b 96px,#5a8a3c 600px)}
.rails{position:absolute;left:-4000px;top:-10px;height:18px;background:
 linear-gradient(#4a4f57,#4a4f57) 0 3px/100% 4px no-repeat,
 linear-gradient(#4a4f57,#4a4f57) 0 12px/100% 4px no-repeat,
 repeating-linear-gradient(90deg,#6b4a2b 0 12px,transparent 12px 30px)}
.tree{position:absolute;transform:translate(-50%,-100%);clip-path:polygon(50% 0,80% 38%,64% 38%,96% 76%,56% 76%,56% 100%,44% 100%,44% 76%,4% 76%,36% 38%,20% 38%);background:linear-gradient(#3f8f4c 0 76%,#6b4a2b 76%)}
.tree.dark{background:linear-gradient(#2e6b3b 0 76%,#5a3e24 76%)}
.house{position:absolute;transform:translate(-50%,-100%);width:60px;height:44px;border-radius:3px}
.house::before{content:"";position:absolute;left:-8px;right:-8px;top:-26px;height:28px;background:inherit;filter:brightness(.7);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house i{position:absolute;width:14px;height:14px;background:#ffe9a8;top:14px;left:10px;box-shadow:26px 0 0 #ffe9a8}

/* station */
.station{position:absolute;top:-16px;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2}
.bld{position:relative;width:300px;height:120px;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;justify-content:center;gap:16px;padding-bottom:0}
.bld .door{width:44px;height:64px;background:#5b3b22;border-radius:22px 22px 0 0}
.bld .win{width:36px;height:40px;background:#cfe9f7;border:4px solid #fff;border-radius:4px;margin-bottom:22px}
.bld .roof{position:absolute;left:-14px;right:-14px;top:-18px;height:20px;border-radius:4px}
.roofs{position:absolute;left:0;right:0;top:-70px;height:72px;display:flex;justify-content:space-around;align-items:flex-end}
.roofs i{display:block;width:80px;height:60px;background:#c4573a;clip-path:polygon(50% 0,100% 100%,0 100%)}
.roofs i:nth-child(2){width:104px;height:74px}
.platform{width:560px;height:16px;background:linear-gradient(#d8d0c2,#b3a998);border-radius:3px}
.sign{position:absolute;top:-150px;background:#1f4e8c;color:#fff;padding:8px 20px;border-radius:10px;text-align:center;box-shadow:0 6px 0 #163a69;transition:.3s;cursor:pointer;white-space:nowrap}
.sign small{display:block;font-size:13px;letter-spacing:3px;opacity:.85}
.sign b{font-size:24px}
.sign .star{position:absolute;right:-12px;top:-12px;background:#ffc93c;color:#5a3a00;font-size:12px;font-weight:800;padding:3px 8px;border-radius:20px}
.sign.flash{animation:flash .8s}
.sign.here{background:#d63c32;box-shadow:0 6px 0 #9a271f,0 0 40px rgba(255,200,60,.9)}
@keyframes flash{50%{transform:scale(1.25);background:#ffc93c;color:#333}}

/* train */
#train{position:absolute;top:-14px;display:flex;align-items:flex-end;gap:8px;transform:translate(-50%,-100%);z-index:3}
#train.rev{transform:translate(-50%,-100%) scaleX(-1)}
.car,.loco{position:relative;height:74px;background:#f6f3ec;border-radius:10px 10px 6px 6px;box-shadow:inset 0 -18px 0 #1f4e8c,inset 0 -23px 0 #d63c32,0 4px 8px rgba(0,0,0,.2)}
.car{width:150px}
.loco{width:180px;border-radius:10px 46px 6px 6px}
.wins{position:absolute;top:12px;left:12px;right:12px;height:24px;border-radius:4px;background:repeating-linear-gradient(90deg,#9fd3ee 0 24px,transparent 24px 32px)}
.loco .wins{right:58px}
.loco .shield{position:absolute;top:10px;right:10px;width:40px;height:28px;background:#9fd3ee;border-radius:4px 30px 4px 4px}
.loco .lamp{position:absolute;right:4px;bottom:26px;width:12px;height:12px;border-radius:50%;background:#ffe27a;box-shadow:0 0 14px #ffd23c}
.loco .stack{position:absolute;top:-12px;left:30px;width:22px;height:14px;background:#444;border-radius:3px 3px 0 0}
.loco .num{position:absolute;left:14px;bottom:24px;font-size:11px;font-weight:800;color:#1f4e8c}
.wheels{position:absolute;bottom:-14px;left:14px;right:14px;display:flex;justify-content:space-between}
.wheels i{width:28px;height:28px;border-radius:50%;border:4px solid #777;background:linear-gradient(0deg,transparent 44%,#aaa 44% 56%,transparent 56%),linear-gradient(90deg,transparent 44%,#aaa 44% 56%,transparent 56%),#2d2d2d}
#train.moving .wheels i{animation:spin .35s linear infinite}
#train.moving .car,#train.moving .loco{animation:bob .22s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{translate:0 -2px}}
.puff{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);pointer-events:none;z-index:4}

.fog{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.5s;background:
 radial-gradient(ellipse 40% 18% at 20% 60%,rgba(255,255,255,.75),transparent),
 radial-gradient(ellipse 45% 16% at 75% 52%,rgba(255,255,255,.65),transparent),
 radial-gradient(ellipse 60% 20% at 50% 75%,rgba(255,255,255,.55),transparent);animation:fogmove 14s ease-in-out infinite alternate}
#stage.misty .fog{opacity:1}
@keyframes fogmove{to{transform:translateX(6%)}}

/* ===== HUD ===== */
#hud{position:fixed;left:20px;right:20px;top:16px;display:flex;justify-content:space-between;align-items:center;z-index:10;transition:opacity .5s,transform .5s}
.brand{background:rgba(255,255,255,.92);padding:10px 18px;border-radius:14px;font-weight:800;letter-spacing:1px;color:#1f4e8c;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.brand small{display:block;font-weight:600;letter-spacing:0;color:#d63c32;font-size:14px}
.btn{background:#d63c32;color:#fff;font-weight:800;font-size:16px;padding:12px 22px;border-radius:40px;box-shadow:0 6px 0 #9a271f;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a271f}
.btn.blue{background:#1f4e8c;box-shadow:0 6px 0 #163a69}
#minimap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(1100px,92vw);height:62px;background:rgba(255,255,255,.92);border-radius:18px;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.15);transition:opacity .5s,transform .5s}
#minimap .line{position:absolute;left:4%;right:4%;top:22px;height:4px;background:#c9d3de;border-radius:4px}
#minimap .dot{position:absolute;top:15px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:3px solid #1f4e8c;cursor:pointer;transition:.2s}
#minimap .dot.has{background:#ffc93c}
#minimap .dot.on{background:#d63c32;border-color:#d63c32;transform:scale(1.3)}
#minimap .dot span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap;font-weight:600;color:#3a4a5c}
#minimap .tm{position:absolute;top:-6px;font-size:22px;margin-left:-14px;transition:none}
body.hubmode #hud,body.hubmode #minimap{opacity:0;pointer-events:none;transform:translateY(-10px)}
#banner{position:fixed;left:50%;top:15%;transform:translateX(-50%);text-align:center;z-index:9;pointer-events:none;opacity:0}
#banner .g{display:inline-block;background:#1f4e8c;color:#fff;padding:6px 18px;border-radius:30px;font-weight:800;letter-spacing:4px}
#banner h1{font-size:clamp(40px,8vw,96px);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35);line-height:1.05;margin-top:6px}
#banner p{color:#fff;font-size:20px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#1d2a3a;color:#fff;padding:14px 22px;border-radius:14px;z-index:60;opacity:0;transition:.4s;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ===== HUB ===== */
#hubbg{position:fixed;inset:0;z-index:0;opacity:0;background:radial-gradient(circle at 80% 10%,#f7d6e6 0,transparent 40%),radial-gradient(circle at 10% 90%,#cfe8d5 0,transparent 45%),linear-gradient(135deg,#eef1fb,#f8eef4 60%,#eaf5ee);overflow:hidden}
.petal{position:absolute;top:-20px;width:12px;height:12px;background:#f4a6c4;border-radius:12px 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(80px) rotate(540deg)}}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(30px);animation:fogmove 10s ease-in-out infinite alternate}
#hub{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
.hub-head{position:absolute;left:calc(30vw + 64px);right:28px;top:24px;height:30vh;display:flex;flex-direction:column;justify-content:center;pointer-events:auto}
.hub-head .g{color:#d63c32;font-weight:800;letter-spacing:4px;font-size:14px}
.hub-head h1{font-size:clamp(36px,5.5vw,72px);line-height:1;color:#1f3b63}
.hub-head .tag{font-size:clamp(16px,1.6vw,22px);color:#3a4a5c;margin-top:6px}
.hub-head .en{color:#7a8798;font-style:italic}
.hub-head .goal{margin-top:10px;background:#fff;border-left:5px solid #ffc93c;padding:8px 14px;border-radius:8px;font-size:15px;max-width:780px}
.hub-head .acts{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}
.badge-tip{position:absolute;left:24px;top:calc(30vh + 30px);font-size:12px;color:#6a7686;pointer-events:none}
.hub-grid{position:absolute;left:24px;right:24px;top:calc(30vh + 56px);bottom:24px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:18px;pointer-events:auto}
.card{position:relative;border-radius:22px;padding:18px;color:#fff;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 12px 30px rgba(30,40,60,.18);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px rgba(30,40,60,.28)}
.card .ic{position:absolute;right:10px;top:4px;font-size:clamp(50px,6vw,90px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.2));transition:.3s}
.card:hover .ic{transform:rotate(-8deg) scale(1.1)}
.card .t{display:inline-block;align-self:flex-start;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);padding:4px 12px;border-radius:20px;font-weight:800;font-size:14px;margin-bottom:auto}
.card .n{font-size:clamp(18px,1.8vw,26px);font-weight:800;line-height:1.15}
.card .a{opacity:.92;font-size:15px}
.card .c{font-size:12px;opacity:.8;margin-top:6px}
.card .k{position:absolute;left:18px;bottom:auto;top:52px;font-size:12px;opacity:.7}

.hubphoto{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(1.5px) saturate(1.15);animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.18) translate(-2%,-1%)}}
.hubshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,35,60,.05),rgba(15,35,60,.45))}
.hub-head{background:rgba(255,253,248,.84);backdrop-filter:blur(12px);border-radius:26px;padding:18px 28px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.badge-tip{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.card .cimg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.card:hover .cimg{transform:scale(1.12)}
.card .cshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.25) 100%)}
.card .t,.card .n,.card .a,.card .c{position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.card.photo .ic{z-index:1;font-size:30px;right:14px;top:14px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;filter:none;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.card.photo{border-bottom:6px solid var(--acc)}
/* ===== VIEWER ===== */
#viewer{position:fixed;inset:0;z-index:50;display:none}
#viewer .shade{position:absolute;inset:0;background:rgba(15,25,40,.45);backdrop-filter:blur(3px)}
.v-card{position:absolute;inset:2.5vh 2.5vw;background:#fffdf8;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transform-origin:0 0;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.v-card header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid #eee5d8}
.v-back{background:#f1ebe0;padding:8px 16px;border-radius:20px;font-weight:600}
.v-title{flex:1;font-size:20px}
.v-time{background:#1f4e8c;color:#fff;padding:3px 10px;border-radius:12px;font-weight:800;font-size:14px;margin-right:8px}
.v-count{color:#8a8070;font-size:14px}
.v-body{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:3vh 4vw;display:flex;flex-direction:column}
.slide h2{font-size:clamp(26px,4.2vh,44px);color:#1f3b63;margin-bottom:1.5vh}
.v-card footer{display:flex;align-items:center;gap:12px;padding:12px 22px;border-top:1px solid #eee5d8}
.v-card footer button{background:#f1ebe0;padding:9px 16px;border-radius:20px;font-weight:600}
.v-card footer .v-next{background:#d63c32;color:#fff}
.v-dots{flex:1;display:flex;gap:8px;justify-content:center}
.v-dots i{width:10px;height:10px;border-radius:5px;background:#ddd2c2;transition:.3s}
.v-dots i.on{width:30px;background:#d63c32}
.v-notes{max-height:0;overflow:hidden;background:#fff6d8;transition:max-height .4s;font-size:16px}
.v-notes.on{max-height:120px}
.v-notes div{padding:12px 22px}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0)*70ms + 150ms)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px)}}
[data-say]{cursor:pointer}
.spk{font-style:normal;font-size:.8em;opacity:.55;background:none}

/* place */
.place{flex-direction:row;gap:3vw;align-items:stretch}
.ph{flex:1.1;border-radius:22px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;animation:kb 24s ease-in-out infinite alternate}
.ph-ic{font-size:min(28vh,20vw);filter:drop-shadow(0 20px 30px rgba(0,0,0,.25));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) rotate(-3deg)}}
.ph-loc{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.92);padding:8px 14px;border-radius:12px;font-weight:600}
.ph-cr{position:absolute;right:12px;bottom:12px;font-size:11px;color:#fff;opacity:.8}
.pinfo{flex:1;display:flex;flex-direction:column;justify-content:center}
.kick{color:#d63c32;font-weight:800;letter-spacing:2px}
.pinfo h4{color:#8a8070;margin:1vh 0 1.5vh;font-size:clamp(16px,2.2vh,22px)}
.fact{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid #eee5d8;border-radius:16px;padding:1.6vh 18px;margin-bottom:1.6vh}
.fact .num{flex:none;width:36px;height:36px;border-radius:50%;background:#ffc93c;font-weight:800;display:flex;align-items:center;justify-content:center}
.fact p{font-size:clamp(17px,2.7vh,28px);font-weight:600}
.fact small{color:#7a8798;font-size:clamp(13px,1.9vh,18px)}
/* vocab */
.vgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:2vh 1.5vw}
.vc{background:#fff;border:2px solid #eee5d8;border-radius:20px;padding:1.5vh 1vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.2s}
.vc:hover{border-color:#ffc93c;transform:translateY(-4px)}
.vc.say{background:#fff6d8;border-color:#ffc93c}
.ve{font-size:min(9vh,6vw);line-height:1.1}
.vimg{width:100%;flex:1;min-height:0;border-radius:14px;background-size:cover;background-position:center;margin-bottom:.6vh;transition:transform .5s}
.vc:hover .vimg{transform:scale(1.04)}
.vc.has{justify-content:flex-start;padding:1vh;overflow:hidden}
.vc.has p{margin-top:.3vh}
.vc b{font-size:clamp(20px,3.4vh,34px);color:#1f3b63;margin-top:.5vh}
.vc small{color:#d63c32;font-weight:600;font-size:clamp(13px,1.9vh,18px)}
.vc p{margin-top:.8vh;font-size:clamp(14px,2.1vh,20px);color:#3a4a5c}
/* dialogue */
.where{color:#8a8070;margin-top:-1vh;margin-bottom:1.5vh}
.lines{flex:1;display:flex;flex-direction:column;gap:1.4vh;justify-content:flex-start}
.line{display:flex;gap:14px;align-items:flex-end;max-width:72%;opacity:0;transform:translateY(24px) scale(.94);transition:.45s cubic-bezier(.2,.9,.3,1.2)}
.line.show{opacity:1;transform:none}
.line.r{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:6vh;height:6vh;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:2vh}
.bub{position:relative;background:#fff;border:1px solid #eee5d8;border-radius:20px 20px 20px 6px;padding:1.2vh 46px 1.2vh 18px}
.line.r .bub{background:#fff1e3;border-color:#f7d8b8;border-radius:20px 20px 6px 20px}
.who{font-size:13px;font-weight:800;color:#8a8070}
.bub p{font-size:clamp(17px,2.7vh,28px);font-weight:600}
.bub small{color:#7a8798;font-size:clamp(13px,1.8vh,17px)}
.bub .spk{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:20px}
.hint{position:absolute;right:4vw;bottom:1.5vh;font-size:13px;color:#a89c88}
.tagp{position:absolute;left:4vw;bottom:1.5vh;font-size:13px;color:#a89c88;font-style:italic}
/* menu */
.mwrap{flex:1;display:flex;gap:3vw}
.paper{flex:1.2;background:#2b2a26;color:#f7efe0;border-radius:20px;padding:2.5vh 2.5vw;display:flex;flex-direction:column;gap:.6vh}
.mh{text-align:center;letter-spacing:4px;font-weight:800;color:#ffc93c;margin-bottom:1vh}
.mi{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed rgba(255,255,255,.2);padding:.6vh 0}
.mi b{font-size:clamp(16px,2.5vh,26px);display:block}
.mi small{opacity:.65;font-size:clamp(12px,1.7vh,16px)}
.mi em{font-style:normal;font-weight:800;color:#ffc93c;font-size:clamp(16px,2.4vh,24px)}
.mfoot{margin-top:auto;font-size:12px;opacity:.5;text-align:center}
.phr{flex:1;display:flex;flex-direction:column;gap:1.6vh;justify-content:center}
.phr h4{color:#8a8070}
/* compare */
.cmp{width:100%;border-collapse:separate;border-spacing:0 1vh}
.cmp th{text-align:left;font-size:clamp(15px,2.2vh,22px);padding:0 2vw;color:#fff}
.cmp th:nth-child(1){background:#d63c32;border-radius:12px 0 0 12px;padding:1vh 2vw}
.cmp th:nth-child(2){background:#1f4e8c}
.cmp th:nth-child(3){background:#8a8070;border-radius:0 12px 12px 0}
.cmp td{background:#fff;padding:1.1vh 2vw;font-size:clamp(17px,2.8vh,28px);font-weight:600;border-top:1px solid #eee5d8;border-bottom:1px solid #eee5d8}
.cmp td:first-child{border-left:1px solid #eee5d8;border-radius:12px 0 0 12px;color:#d63c32}
.cmp td:nth-child(2){color:#1f4e8c;transition:.3s}

  if(dl&&R()<.6){const h2=70+R()*50;el("tree dark",{left:x+20+"px",top:"-62px",width:h2*.5+"px",height:h2+"px"})}
 }

  sg.onclick=()=>{if(mode==="map")travel(i)};s.appendChild(sg);
 });
 const t=el("",{},`<div class="car"><div class="wins"></div><div class="wheels"><i></i><i></i></div></div><div class="car"><div class="wins"></div><div class="wheels"><i></i><i></i></div></div><div class="loco"><div class="stack"></div><div class="wins"></div><div class="shield"></div><div class="lamp"></div><div class="num">SE3</div><div class="wheels"><i></i><i></i><i></i></div></div>`);

async function travel(to){
 if(busy||to===cur||to<0||to>=STATIONS.length)return;busy=true;hideBanner();
 const from=trainX,target=stX(to),dist=Math.abs(target-from),dur=Math.min(7500,1800+dist*1.05);
 dir=Math.sign(target-from);train.classList.toggle("rev",dir<0);train.classList.add("moving");
 stage.classList.remove("misty");
 const c0={...cam},passed=new Set();const sm=setInterval(puff,130);
 await tween(dur,(e,t)=>{
  trainX=lerp(from,target,e);
  cam.x=trainX+dir*160*Math.sin(Math.PI*t);
  const k=Math.min(1,t*4);cam.s=lerp(c0.s,1,k)-.2*Math.sin(Math.PI*t);cam.y=lerp(c0.y,-120,k);
  STATIONS.forEach((_,i)=>{if(i!==to&&!passed.has(i)&&Math.abs(trainX-stX(i))<30){passed.add(i);const s=document.querySelector(`.sign[data-i="${i}"]`);s.classList.remove("flash");void s.offsetWidth;s.classList.add("flash")}});
  render();
 });
 clearInterval(sm);train.classList.remove("moving");cur=to;updateHUD();busy=false;arrive(to);
}
function showBanner(i){const b=$("#banner"),L=LESSONS[i];b.innerHTML=`<span class="g">GA ${i+1}</span><h1>${STATIONS[i]}</h1>${L?`<p>${L.tag}</p>`:""}`;
 b.animate([{opacity:0,transform:"translateX(-50%) scale(1.6)",filter:"blur(12px)"},{opacity:1,transform:"translateX(-50%) scale(1)",filter:"blur(0)"}],{duration:700,easing:"cubic-bezier(.2,.9,.3,1.2)",fill:"forwards"})}

async function arrive(i){
 busy=true;const c0={...cam};
 await tween(1200,e=>{cam.x=lerp(c0.x,stX(i),e);cam.s=lerp(c0.s,1.45,e);cam.y=lerp(c0.y,-150,e);render()});
 if(i===2)stage.classList.add("misty");
 showBanner(i);busy=false;
 if(LESSONS[i]){await wait(1500);openHub(i)}
 else toast(`Ga ${i+1} · ${STATIONS[i]}: bài học đang được soạn. Bấm “Ga tiếp theo” để đi tiếp.`);
}

 const olds=[...body.querySelectorAll(".slide")],old=olds.length;
 olds.forEach(o=>{if(o.classList.contains("out")){o.remove();return}o.classList.add("out");o.style.pointerEvents="none";
  o.animate([{opacity:1,transform:"none"},{opacity:0,transform:`translateX(${-d*80}px) scale(.96)`}],{duration:300,easing:"ease-in",fill:"forwards"}).onfinish=()=>o.remove()});
 body.insertAdjacentHTML("beforeend",R[s.type](s));const nw=body.lastElementChild;
 if(old){nw.animate([{opacity:0,transform:`translateX(${d*100}px) scale(.98)`},{opacity:1,transform:"none"}],{duration:550,easing:"cubic-bezier(.2,.9,.3,1)"})}
 if(s.type==="dialogue")setTimeout(applyReveal,old?250:500);
}
function next(){const st=curStop(),s=curSlide();
 if(s.type==="dialogue"&&V.rev<s.lines.length){V.rev++;applyReveal();return}
 if(V.k<st.slides.length-1){V.k++;V.rev=1;showSlide(1)}
 else if(V.si<LESSONS[hubIdx].stops.length-1){V.si++;V.k=0;V.rev=1;showSlide(1);toast(`➡ Chuyển sang: ${curStop().time} · ${curStop().name}`)}
 else toast("🏁 Hết bài Đà Lạt! Về sân ga để lên tàu đi tiếp.")}
function prev(){const s=curSlide();
 if(s.type==="dialogue"&&V.rev>1){V.rev--;applyReveal();return}
 const full=x=>x.type==="dialogue"?x.lines.length:1;
 if(V.k>0){V.k--;V.rev=full(curSlide());showSlide(-1)}
 else if(V.si>0){V.si--;V.k=curStop().slides.length-1;V.rev=full(curSlide());showSlide(-1)}}
function flipFrom(card,reverse){const vc=$(".v-card"),r=card.getBoundingClientRect(),v=vc.getBoundingClientRect();
 const kf=[{transform:`translate(${r.left-v.left}px,${r.top-v.top}px) scale(${r.width/v.width},${r.height/v.height})`,borderRadius:"60px",opacity:.6},{transform:"none",borderRadius:"26px",opacity:1}];
 if(reverse)kf.reverse();return vc.animate(kf,{duration:reverse?500:700,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"})}
function openViewer(si,card){if(busy)return;mode="viewer";V.si=si;V.k=0;V.rev=1;
 $(".v-body").innerHTML="";$("#viewer").style.display="block";
 $("#viewer .shade").animate([{opacity:0},{opacity:1}],{duration:500,fill:"forwards"});
 flipFrom(card);setTimeout(()=>showSlide(1),280)}
async function closeViewer(){const card=$(".hub-grid").children[V.si];
 $("#viewer .shade").animate([{opacity:1},{opacity:0}],{duration:450,fill:"forwards"});
 await flipFrom(card,true).finished;$("#viewer").style.display="none";$(".v-card").getAnimations().forEach(a=>a.cancel());mode="hub";speechSynthesis&&speechSynthesis.cancel();
 card.animate([{transform:"scale(1.08)"},{transform:"none"}],{duration:400,easing:"ease-out"})}
$(".v-next").onclick=next;$(".v-prev").onclick=prev;$(".v-back").onclick=closeViewer;$("#viewer .shade").onclick=closeViewer;
$(".v-notebtn").onclick=()=>$(".v-notes").classList.toggle("on");
$(".v-full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener("click",e=>{const t=e.target.closest("[data-say]");if(t&&mode==="viewer"){speak(t.dataset.say);if(t.classList.contains("vc")){t.classList.add("say");setTimeout(()=>t.classList.remove("say"),900)}}});

/* ================= ĐIỀU KHIỂN ================= */
function hideIntro(){const i=$("#intro");if(i.style.display==="none")return;i.animate([{opacity:1},{opacity:0}],{duration:500,fill:"forwards"}).onfinish=()=>i.style.display="none"}
$("#btnStart").onclick=()=>{hideIntro();setTimeout(()=>travel(2),300)};
$("#btnNext").onclick=()=>{hideIntro();travel(cur+1)};
addEventListener("keydown",e=>{
 if(mode==="viewer"){if(["ArrowRight"," ","PageDown","Enter"].includes(e.key)){e.preventDefault();next()}else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}else if(e.key==="Escape")closeViewer();else if(e.key.toLowerCase()==="n")$(".v-notes").classList.toggle("on");else if(e.key.toLowerCase()==="f")$(".v-full").click()}
 else if(mode==="hub"){const n=parseInt(e.key);if(n>=1&&n<=LESSONS[hubIdx].stops.length)openViewer(n-1,$(".hub-grid").children[n-1]);else if(e.key==="Escape")closeHub()}
 else if(mode==="map"){if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();hideIntro();travel(cur+1)}else if(e.key==="ArrowLeft"){hideIntro();travel(cur-1)}else if(e.key==="Enter"&&LESSONS[cur]&&$("#intro").style.display==="none")openHub(cur)}
});
addEventListener("resize",render);
updateHUD();render();
</script>
</body>
